<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Rotator</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
        }
        .image-container {
            position: relative; height: 100%; width: 100%;
        }
        .image {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .image.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="image-container" id="imageContainer">
        <!-- Images will be dynamically inserted here -->
    </div>

    <script>
        window.onload = function() {
            const totalImagesCount = 10; // Set this to the total number of image*.jpg files you have
            const container = document.getElementById('imageContainer');

            // Dynamically create image elements
            for (let i = 1; i <= totalImagesCount; i++) {
                const img = document.createElement('img');
                img.src = `media/image${i}.jpg`;
                img.classList.add('image');
                img.id = `image${i}`;
                container.appendChild(img);
            }

            const images = document.querySelectorAll('.image');
            let currentImageIndex = 0;
            const totalImages = images.length;

            function showNextImage() {
                images[currentImageIndex].classList.remove('show');
                currentImageIndex = (currentImageIndex + 1) % totalImages;
                images[currentImageIndex].classList.add('show');
            }

            // Initially show the first image
            images[currentImageIndex].classList.add('show');

            // Rotate images every 8 seconds
            setInterval(showNextImage, 8000);
        };
    </script>
</body>
</html>
